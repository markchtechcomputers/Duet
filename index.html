/* Mobile-first fit: keep the app frame, content and original four nav symbols on one phone screen. */
html,body{height:100%;min-height:0}
body{overflow:hidden}
#app{height:100dvh;min-height:0;max-height:100dvh}
.top{flex:none;padding:7px 14px 5px;min-height:48px}
.mark{width:30px;height:30px;border-radius:10px;font-size:19px}
.logo{font-size:25px}
.iconbtn{width:34px;height:34px}
.tabs{flex:none;gap:6px;padding:5px 12px 7px}
.tabs button{padding:7px 4px;font-size:11px}
main{min-height:0;padding:9px 12px 8px;overflow:auto;overscroll-behavior:contain}
main:has(.profilecard){overflow:hidden;display:flex;flex-direction:column}
.greeting{font-size:12px;line-height:1.25;margin:0}
.greeting strong{font-size:18px;line-height:1.2}
.dateideas{flex:none;gap:6px;margin:6px -12px 7px;padding:0 12px 2px}
.idea{padding:5px 8px;font-size:11px}
.idea span{width:20px;height:20px;margin-right:4px}
.profilecard{height:clamp(170px,calc(100dvh - 425px),360px);min-height:0;flex:1 1 auto;border-radius:20px}
.details{padding:12px}
.profilecard h2{font-size:clamp(22px,6vw,29px)}
.tag{font-size:10px;padding:3px 7px;margin:4px 3px 0 0}
.distance{top:9px;left:9px;padding:4px 8px;font-size:10px}
.more{top:7px;right:7px;width:32px;height:32px}
.actions{flex:none;gap:9px;margin:8px 0 4px}
.action{width:40px;height:40px;font-size:19px}
.action.big{width:48px;height:48px;font-size:24px}
.hint{flex:none;font-size:10px;line-height:1.25;padding-bottom:1px}
.bottomnav{flex:none;padding:4px 4px max(5px,env(safe-area-inset-bottom))}
.bottomnav button{padding:3px 0;gap:2px;font-size:11px}
.navico{font-size:22px;line-height:1}
.smallnote{display:none}
.personrow{padding:9px;gap:9px}
.panel{padding:11px}
.empty{padding:20px 10px}
@media(max-height:700px){
 .top{min-height:42px;padding:4px 12px}
 .mark{width:27px;height:27px}
 .logo{font-size:23px}
 .tabs{padding:3px 10px 5px}
 main{padding:7px 10px 5px}
 .dateideas{margin:4px -10px 5px;padding-left:10px;padding-right:10px}
 .profilecard{height:clamp(145px,calc(100dvh - 430px),280px)}
 .details{padding:10px}
 .profilecard h2{font-size:23px}
 .tag{padding:2px 6px;margin-top:3px}
 .actions{gap:7px;margin:6px 0 3px}
 .action{width:36px;height:36px}
 .action.big{width:43px;height:43px}
 .bottomnav{padding-top:3px;padding-bottom:max(4px,env(safe-area-inset-bottom))}
}
@media(min-width:600px){
 body{padding:0}
 #app{height:100dvh;min-height:0;border-radius:0;box-shadow:none}
 .profilecard{height:clamp(250px,calc(100dvh - 425px),420px)}
}


.profile-preview{display:flex;align-items:flex-start;gap:13px;margin:10px 0 18px}
.preview-avatar{width:76px;height:76px;flex:none;border-radius:22px;display:grid;place-items:center;background:linear-gradient(145deg,#ffb6a6,#b6387b);background-size:cover;background-position:center;color:#fff;font-size:27px;font-weight:800}
.preview-copy{min-width:0;flex:1}
.preview-name{font-size:21px;font-weight:800;letter-spacing:-.4px}
#previewBio{font-size:13px;margin:7px 0;color:var(--muted);overflow-wrap:anywhere}
#previewInterests .chip{display:inline-block;margin:3px 4px 0 0}
#profileForm .chips .chip{display:inline-flex;align-items:center;gap:5px}
#profileForm .chips input{accent-color:var(--pink)}
[hidden]{display:none!important}

 if(a){a.style.backgroundImage=photo?'url("'+photo.replace(/["\\]/g,'')+'")':'';a.textContent=photo?'':name.slice(0,1).toUpperCase()}
 if(interests)interests.innerHTML=[...document.querySelectorAll('input[name="interest"]:checked')].map(x=>'<span class="chip">'+esc(x.value)+'</span>').join('');
 const gallery=$('#newPhotoPreviews');if(gallery)gallery.innerHTML=files.map(file=>'<img src="'+URL.createObjectURL(file)+'" alt="Selected photo preview" title="'+esc(file.name)+'" style="width:76px;height:76px;object-fit:cover;border-radius:12px">').join('');
 if(wrap)wrap.hidden=gender!=='Self-described';
}async function saveProfile(e){e.preventDefault();const age=Number($('#age').value),files=[...($('#photoFiles')?.files||[])];if(age<18||age>99){say('Duet is for adults 18 and over.');return}if(files.length>10){say('Choose no more than 10 photos at once.');return}if(files.some(f=>!['image/jpeg','image/png','image/webp','image/gif'].includes(f.type)||f.size>5*1024*1024)){say('Each photo must be JPG, PNG, WEBP or GIF and no larger than 5 MB.');return}const interests=[...document.querySelectorAll('input[name="interest"]:checked')].map(x=>x.value);const saveBtn=$('#saveProfileBtn');saveBtn.disabled=true;saveBtn.textContent='Uploading photos…';try{let imageUrls=(me?.image_urls||[]).filter(u=>!pendingRemovedPhotos.has(u));for(const file of files){if(imageUrls.length>=10)throw new Error('Your profile can contain up to 10 photos total. Remove existing photos before adding more.');const ext=({ 'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif'})[file.type];const path=session.user.id+'/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;const up=await db.storage.from('profile-images').upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type});if(up.error)throw up.error;const pub=db.storage.from('profile-images').getPublicUrl(up.data.path);imageUrls.push(pub.data.publicUrl)}const photo=imageUrls[0]||'';const row={id:session.user.id,name:$('#name').value.trim(),age,gender:$('#gender').value==='Self-described'?($('#selfDescribed').value.trim()||'Self-described'):$('#gender').value,show_me:$('#show').value,intent:$('#intent').value,city:$('#city').value.trim(),photo_url:photo,image_urls:imageUrls,bio:$('#bio').value.trim(),interests,updated_at:new Date().toISOString()};const {error}=await db.from('profiles').upsert(row);if(error)throw error;me=row;pendingRemovedPhotos.clear();say('Profile updated with '+imageUrls.length+' photo(s).');await loadData();render()}catch(err){say(err.message||'Could not save profile.')}finally{if($('#saveProfileBtn')){saveBtn.disabled=false;saveBtn.textContent='Save profile'}}}
async function loadData(){if(!session)return;const id=session.user.id;let r=await db.from('profiles').select('*').eq('id',id).maybeSingle();if(r.error)throw r.error;me=r.data;if(!me)return;const [ps,ls,ms]=await Promise.all([db.from('profiles').select('*').neq('id',id).order('created_at',{ascending:false}).limit(100),db.from('likes').select('*').or('sender_id.eq.'+id+',receiver_id.eq.'+id),db.from('matches').select('*').or('user_one.eq.'+id+',user_two.eq.'+id).order('created_at',{ascending:false})]);if(ps.error)throw ps.error;if(ls.error)throw ls.error;if(ms.error)throw ms.error;let blocked=await db.from('blocks').select('blocked_id').eq('blocker_id',id);const blockedIds=new Set((blocked.data||[]).map(x=>x.blocked_id));profiles=(ps.data||[]).filter(p=>!blockedIds.has(p.id)).map(person);likes=ls.data||[];matches=ms.data||[];idx=0}
const demoProfiles=[{id:'duet-demo-1',n:'Duet Demo',a:26,gender:'Woman',intent:'Getting to know people',city:'Demo location',bio:'This is a sample profile so you can test how Explore works. This is not a real person.',tags:['Music','Coffee','Adventure'],photos:[],photo:'',photoIndex:0,z:'',demo:true,raw:{show_me:'Everyone'}},{id:'duet-demo-2',n:'Demo Alex',a:28,gender:'Man',intent:'Meaningful connection',city:'Demo location',bio:'Test profile only — not a real Duet member. Real profiles appear when people sign up.',tags:['Movies','Travel','Food'],photos:[],photo:'',photoIndex:0,z:'',demo:true,raw:{show_me:'Everyone'}}];let dismissedDemoIds=new Set();function people(){const myGender=me?.gender,show=me?.show_me||'Everyone';const real=profiles.filter(p=>!likes.some(l=>l.sender_id===session.user.id&&l.receiver_id===p.id)&&!matches.some(m=>m.user_one===p.id||m.user_two===p.id)&&(!myGender||!p.raw.show_me||p.raw.show_me==='Everyone'||p.raw.show_me===myGender||p.raw.show_me==='Non-binary people'&&myGender==='Non-binary')&&(show==='Everyone'||show==='Women'&&['Woman','Trans woman'].includes(p.gender)||show==='Men'&&['Man','Trans man'].includes(p.gender)||show==='Non-binary people'&&p.gender==='Non-binary'));return real.length?real:demoProfiles.filter(p=>!dismissedDemoIds.has(p.id)&&(show==='Everyone'||show==='Women'&&p.gender==='Woman'||show==='Men'&&p.gender==='Man'))}
function nav(){const icons={disc:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.7"/><path d="m16 16 4.5 4.5"/></svg>',likes:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 8.7c0 5.1-8.8 10.1-8.8 10.1S3.2 13.8 3.2 8.7a4.5 4.5 0 0 1 8.8-1.1 4.5 4.5 0 0 1 8.8 1.1Z"/></svg>',chats:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a7.5 7.5 0 0 1-8 7.5 8.7 8.7 0 0 1-4-.9L3 20l1.4-4.2A7.1 7.1 0 0 1 4 12c0-4.2 3.6-7.5 8-7.5s8 3.1 8 7Z"/></svg>',me:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0Z"/></svg>'};return [['disc','Explore'],['likes','Likes'],['chats','Chats'],['me','Settings']].map(x=>'<button class="'+(tab===x[0]?'active':'')+'" onclick="go(&quot;'+x[0]+'&quot;)"><span class="navico">'+icons[x[0]]+'</span>'+x[1]+((x[0]==='likes'&&likes.some(l=>l.receiver_id===session.user.id&&l.sender_id!==session.user.id))||(x[0]==='chats'&&matches.length)?'<i class="badge"></i>':'')+'</button>').join('')}
function render(){document.documentElement.style.colorScheme=theme;const dark=theme==='dark';document.documentElement.style.setProperty('--bg',dark?'#120a22':'#fbf8ff');document.documentElement.style.setProperty('--card',dark?'#1d1331':'#fff');document.documentElement.style.setProperty('--ink',dark?'#f4effc':'#241633');document.documentElement.style.setProperty('--muted',dark?'#a99fc2':'#796d89');document.documentElement.style.setProperty('--line',dark?'#352746':'#eee5f5');$('#theme').textContent=dark?'☀':'☾';if(!session){$('#tabs').innerHTML='';$('#nav').style.display='none';$('#main').innerHTML=authView();return}$('#nav').style.display='flex';$('#nav').innerHTML=nav();if(!me){$('#tabs').innerHTML='';$('#main').innerHTML=profileForm();return}$('#tabs').innerHTML=tab==='disc'?'<button class="'+(sub==='you'?'active':'')+'" onclick="setSub(\'you\')">♥ For you</button><button class="'+(sub==='astro'?'active':'')+'" onclick="setSub(\'astro\')">✧ Astrology</button>':'';$('#main').innerHTML=tab==='disc'?explore():tab==='likes'?likesView():tab==='chats'?chatsView():tab==='chat'?chatView():profileView()}
function empty(title,desc){return '<div class="empty"><div style="font-size:42px">♡</div><h2>'+esc(title)+'</h2><p class="subtle">'+esc(desc)+'</p></div>'}
function explore(){let list=people();if(sub==='astro')return '<p class="greeting">For fun, not fate</p><h2>Cosmic chemistry</h2><p class="subtle">Use star signs as conversation starters.</p>'+list.map(p=>personRow(p)).join('')||empty('No profiles yet','When real people join Duet, their profiles will appear here.');let p=list[idx];if(!p)return '<p class="greeting">Good to see you,</p><p class="greeting"><strong>'+esc(me.name)+' ✨</strong></p>'+empty('No new profiles right now','These clearly labelled demo cards let you test Explore until real members appear.')+'<button class="btn secondary" onclick="refresh()">Refresh profiles</button>';return '<p class="greeting">Good '+(new Date().getHours()<12?'morning':new Date().getHours()<18?'afternoon':'evening')+',</p><p class="greeting"><strong>'+esc(me.name)+' ✨</strong></p><article class="profilecard"><div class="cover" style="'+cover(p)+';background-size:cover;background-position:center"></div><span class="distance">'+(p.demo?'DEMO PROFILE · NOT A REAL PERSON':'⌖ '+esc(p.city)+' · Duet member')+'</span><button class="more" onclick="profileDetail(\''+p.id+'\')">···</button><div class="details"><h2>'+esc(p.n)+', '+p.a+'</h2><div>'+esc(p.intent)+' · '+esc(p.city)+'</div><p style="margin:8px 0 0;font-size:14px">'+esc(p.bio)+'</p>'+p.tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div></article><div class="actions"><button class="action" aria-label="Skip" onclick="skip()">↶</button><button class="action pass" aria-label="Pass" onclick="skip()">✕</button><button class="action star" aria-label="Super like" onclick="sendLike(true)">★</button><button class="action big" aria-label="Like" onclick="sendLike(false)">♥</button><button class="action" aria-label="Report profile" onclick="report(\''+p.id+'\')">⚑</button></div><div class="hint">A chat opens when you both like each other.</div>'}
function personRow(p){return '<div class="personrow" onclick="profileDetail(\''+p.id+'\')">'+avatar(p)+'<div class="meta"><strong>'+esc(p.n)+', '+p.a+'</strong><div class="subtle">'+esc(p.intent)+' · '+esc(p.city)+'</div></div><button class="btn small" onclick="event.stopPropagation();likePerson(\''+p.id+'\')">♥ Like</button></div>'}
async function sendLike(superLike){const p=people()[idx];if(!p)return;await likePerson(p.id,superLike);await refresh()}
async function likePerson(id,superLike=false){if(!session)return;if(String(id).startsWith('duet-demo-')){say('This is a demo profile, not a real person. Likes are disabled for demos.');return;}const {error}=await db.from('likes').upsert({sender_id:session.user.id,receiver_id:id},{onConflict:'sender_id,receiver_id',ignoreDuplicates:true});if(error){say(error.message);return}const back=await db.from('likes').select('sender_id').eq('sender_id',id).eq('receiver_id',session.user.id).maybeSingle();if(back.data){const [one,two]=session.user.id<id?[session.user.id,id]:[id,session.user.id];const m=await db.from('matches').upsert({user_one:one,user_two:two},{onConflict:'user_one,user_two',ignoreDuplicates:true});if(m.error)say(m.error.message);else say('It’s a mutual like! You matched.')}else say(superLike?'Super Like sent.':'Like sent.');await loadData();render()}
function skip(){const list=people();if(list.length){const p=list[idx];if(p.demo)dismissedDemoIds.add(p.id);else profiles=profiles.filter(x=>x.id!==p.id);idx=0;render()}}
function likesView(){const incoming=likes.filter(l=>l.receiver_id===session.user.id&&l.sender_id!==session.user.id);const outgoing=likes.filter(l=>l.sender_id===session.user.id);const rows=incoming.map(l=>profiles.find(p=>p.id===l.sender_id)).filter(Boolean);return '<h2>Likes</h2><p class="subtle">People who liked you appear first. Like them back to match.</p><h3>People who liked you ('+rows.length+')</h3>'+rows.map(personRow).join('')+(rows.length?'':empty('No likes received yet','Your profile is live. When someone likes you, they will appear here.'))+'<h3>Your likes ('+outgoing.length+')</h3>'+outgoing.map(l=>{const p=profiles.find(x=>x.id===l.receiver_id);return p?'<div class="personrow">'+avatar(p)+'<div class="meta"><strong>'+esc(p.n)+'</strong><div class="subtle">You sent a like</div></div></div>':''}).join('')}
function otherId(m){return m.user_one===session.user.id?m.user_two:m.user_one}
function chatsView(){return '<h2>Your chats</h2><p class="subtle">Private messages with your mutual matches.</p>'+matches.map(m=>{const p=profiles.find(x=>x.id===otherId(m));return '<div class="personrow" onclick="openChat(\''+m.id+'\')">'+(p?avatar(p):'<div class="avatar">♡</div>')+'<div class="meta"><strong>'+esc(p?p.n:'Duet member')+'</strong><div class="subtle">Open conversation</div></div><span>›</span></div>'}).join('')||empty('No matches yet','When two people like each other, a private chat opens here.')}
async function openChat(id){activeMatch=id;tab='chat';await loadMessages();render();subscribeMessages()}
async function loadMessages(){const r=await db.from('messages').select('*').eq('match_id',activeMatch).order('created_at',{ascending:true}).limit(200);if(r.error){say(r.error.message);return}messages=r.data||[]}
function chatView(){const m=matches.find(x=>x.id===activeMatch);if(!m){tab='chats';return chatsView()}const p=profiles.find(x=>x.id===otherId(m));return '<div class="sectionhead"><button class="iconbtn" onclick="go(\'chats\')">‹</button><div style="flex:1"><strong>'+esc(p?p.n:'Duet member')+'</strong></div><button class="btn small secondary" onclick="report(\''+otherId(m)+'\')">Report</button></div><div style="min-height:40vh;display:flex;flex-direction:column;justify-content:flex-end">'+messages.map(x=>'<div class="message '+(x.sender_id===session.user.id?'mine':'')+'">'+esc(x.body)+'<div style="font-size:10px;opacity:.7;text-align:right">'+esc(new Date(x.created_at).toLocaleString())+'</div></div>').join('')+'</div><form class="composer" onsubmit="sendMessage(event)"><input id="messageInput" class="field" maxlength="1000" placeholder="Write a message…" required><button class="btn small" type="submit">Send</button></form>'}
async function sendMessage(e){e.preventDefault();const input=$('#messageInput'),body=input.value.trim();if(!body||!activeMatch)return;const r=await db.from('messages').insert({match_id:activeMatch,sender_id:session.user.id,body});if(r.error){say(r.error.message);return}input.value='';await loadMessages();render()}
function subscribeMessages(){if(channel){db.removeChannel(channel);channel=null}channel=db.channel('match-'+activeMatch).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'match_id=eq.'+activeMatch},async()=>{await loadMessages();if(tab==='chat')render()}).subscribe()}
function profileView(){return profileForm()}
function nextPhoto(id){const p=profiles.find(x=>x.id===id);if(!p||!p.photos||p.photos.length<2)return;p.photoIndex=((p.photoIndex||0)+1)%p.photos.length;p.photo=p.photos[p.photoIndex];const card=document.querySelector('.profilecard .cover');if(card&&tab==='disc')card.style.backgroundImage='url('+JSON.stringify(p.photo)+')';const detail=$('#detailCover');if(detail)detail.style.backgroundImage='url('+JSON.stringify(p.photo)+')'}
function profileDetail(id){const p=profiles.find(x=>x.id===id)||demoProfiles.find(x=>x.id===id);if(!p)return;if(p.demo){modal('<div class="modalhead"><h2>'+esc(p.n)+', '+p.a+'</h2><button class="iconbtn" onclick="closeModal()">×</button></div><p><strong>DEMO PROFILE — NOT A REAL PERSON</strong></p><p>'+esc(p.bio)+'</p><p>Demo profiles are only here to let you test Explore. Likes, matches, reports, and messages are disabled.</p>'+button('Got it','closeModal()'));return}modal('<div class="modalhead"><h2>'+esc(p.n)+', '+p.a+'</h2><button class="iconbtn" onclick="closeModal()">×</button></div><div class="profilecard" style="height:300px"><div class="cover" id="detailCover" style="'+cover(p)+';background-size:cover;background-position:center" '+(p.photos.length>1?'onclick="nextPhoto(\''+p.id+'\')" role="button" aria-label="Show next profile photo"':'')+'></div><div class="details"><h2>'+esc(p.n)+', '+p.a+'</h2><p>'+esc(p.city)+' · '+esc(p.intent)+'</p></div></div><p>'+esc(p.bio)+'</p>'+p.tags.map(t=>'<span class="chip">'+esc(t)+'</span>').join('')+button('♥ Like '+esc(p.n),'closeModal();likePerson(\''+id+'\')')+button('Report or block','closeModal();report(\''+id+'\')','btn secondary'))}
function report(id){modal('<div class="modalhead"><h2>Safety options</h2><button class="iconbtn" onclick="closeModal()">×</button></div><label class="label">Report reason</label><textarea id="reportReason" class="field" maxlength="500" placeholder="Tell us what happened"></textarea>'+button('Submit report','submitReport(\''+id+'\')')+button('Block this person','blockUser(\''+id+'\')','btn secondary'))}
async function submitReport(id){const reason=$('#reportReason').value.trim();if(reason.length<3){say('Please add a short reason.');return}const r=await db.from('reports').insert({reporter_id:session.user.id,reported_id:id,reason});if(r.error)say(r.error.message);else{say('Report submitted.');closeModal()}}
async function blockUser(id){const r=await db.from('blocks').upsert({blocker_id:session.user.id,blocked_id:id},{onConflict:'blocker_id,blocked_id'});if(r.error)say(r.error.message);else{say('Person blocked.');closeModal();await loadData();render()}}
async function refresh(){try{await loadData();render()}catch(e){say(e.message||'Could not load Duet data.');console.error(e)}}
async function boot(){try{if(!session){render();return}await loadData();render()}catch(e){say('Duet could not load account data: '+(e.message||'try again'));console.error(e);render()}}
function removeProfilePhoto(url){pendingRemovedPhotos.add(url);const tile=[...document.querySelectorAll('[data-photo-url]')].find(x=>x.dataset.photoUrl===url);if(tile)tile.remove();updateProfilePreview();say('Photo marked for removal. Save your profile to confirm.')}window.removeProfilePhoto=removeProfilePhoto;window.updateProfilePreview=updateProfilePreview;window.authSubmit=authSubmit;window.googleSignIn=googleSignIn;window.authMode=authMode;window.signOut=signOut;window.saveProfile=saveProfile;window.go=function(k){tab=k;render();if(k!=='chat'&&channel){db.removeChannel(channel);channel=null}};window.setSub=function(k){sub=k;idx=0;render()};window.sendLike=sendLike;window.likePerson=likePerson;window.skip=skip;window.nextPhoto=nextPhoto;window.profileDetail=profileDetail;window.openChat=openChat;window.sendMessage=sendMessage;window.report=report;window.submitReport=submitReport;window.blockUser=blockUser;window.closeModal=closeModal;window.refresh=refresh;
$('#theme').addEventListener('click',()=>{theme=theme==='dark'?'light':'dark';render()});
db.auth.onAuthStateChange((_event,s)=>{session=s;setTimeout(()=>boot(),0)});
db.auth.getSession().then(({data})=>{session=data.session;boot()});
render();
})();
