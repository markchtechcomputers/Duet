<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbf8ff"><meta name="description" content="Duet — meaningful connections start with a little chemistry."><title>Duet — Meet your kind of people</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf8ff;--card:#fff;--ink:#241633;--muted:#796d89;--line:#eee5f5;--pink:#d7357a;--coral:#ff7a59;--gold:#ffbd3d;--shadow:0 18px 45px #42205418}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Bricolage Grotesque",system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:3px}#app{max-width:480px;min-height:100dvh;margin:auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative}.top{display:flex;align-items:center;padding:13px 18px 8px;gap:10px}.logo{font-size:28px;letter-spacing:-1.3px;font-weight:800;background:linear-gradient(90deg,var(--pink),var(--coral));color:transparent;background-clip:text}.mark{width:34px;height:34px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(140deg,var(--gold),var(--coral),var(--pink));color:white;font-size:21px}.spacer{flex:1}.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:50%;width:40px;height:40px;color:var(--ink)}.tabs{display:flex;gap:7px;padding:8px 16px 12px;border-bottom:1px solid var(--line)}.tabs button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--muted);padding:9px 5px;border-radius:22px;font-weight:700;font-size:12px}.tabs button.active{background:linear-gradient(100deg,var(--pink),var(--coral));color:white;border-color:transparent}main{flex:1;padding:16px;overflow:auto;padding-bottom:24px}.greeting{color:var(--muted);font-size:13px;margin:0 0 3px}.greeting strong{display:block;color:var(--ink);font-size:22px}.subtle{color:var(--muted);font-size:13px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:8px 0}.sectionhead h2,h2{margin:0;font-size:24px;letter-spacing:-.7px}h3{font-size:15px;margin:18px 0 8px}.dateideas{display:flex;gap:8px;overflow:auto;margin:12px -16px;padding:0 16px 3px}.idea{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:22px;padding:8px 12px;font-size:12px;font-weight:700}.idea span{display:inline-grid;place-items:center;background:#fce7f0;color:var(--pink);border-radius:50%;width:24px;height:24px;margin-right:5px}.profilecard{height:min(500px,54dvh);min-height:340px;border-radius:25px;position:relative;overflow:hidden;background:linear-gradient(145deg,#ffb9a8,#b63d81 62%,#4a2b6e);box-shadow:var(--shadow);display:flex;align-items:flex-end;color:white}.cover{position:absolute;inset:0;background-size:cover;background-position:center}.profilecard:after{content:"";position:absolute;inset:25% 0 0;background:linear-gradient(transparent,#16051fe8)}.details{position:relative;z-index:1;padding:18px;width:100%}.profilecard h2{font-size:31px;letter-spacing:-.8px;margin:0 0 4px}.verified{display:inline-grid;place-items:center;border-radius:50%;background:#2f8fff;color:white;font-size:12px;width:18px;height:18px;vertical-align:middle}.tag{display:inline-block;padding:5px 10px;border:1px solid #ffffff55;background:#ffffff20;border-radius:20px;font-size:12px;margin:7px 5px 0 0}.distance{position:absolute;z-index:2;top:14px;left:14px;background:#1b0b2b8c;padding:6px 10px;border-radius:20px;font-size:12px}.more{position:absolute;z-index:3;top:12px;right:12px;background:#1b0b2b80;color:white;border:0;border-radius:50%;width:38px;height:38px;font-size:22px}.actions{display:flex;justify-content:center;align-items:center;gap:12px;margin:15px 0 8px}.action{display:grid;place-items:center;width:49px;height:49px;border:1px solid var(--line);border-radius:50%;background:var(--card);box-shadow:0 5px 15px #42205412;font-size:21px;color:var(--pink)}.action.pass{color:#ef536a}.action.star{color:#e7a319}.action.big{width:63px;height:63px;color:white;border:0;background:linear-gradient(135deg,var(--pink),var(--coral));font-size:27px}.hint{text-align:center;color:var(--muted);font-size:12px}.bottomnav{display:flex;border-top:1px solid var(--line);background:var(--card);padding:6px 4px max(7px,env(safe-area-inset-bottom))}.bottomnav button{position:relative;flex:1;border:0;background:none;color:var(--muted);padding:5px 0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px}.bottomnav button.active{color:var(--pink);font-weight:800}.navico{font-size:22px;line-height:1.1}.badge{position:absolute;top:1px;right:calc(50% - 22px);width:8px;height:8px;background:var(--pink);border:2px solid white;border-radius:50%}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 5px 20px #42205408}.personrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px;margin:8px 0}.avatar{width:50px;height:50px;flex:none;border-radius:50%;display:grid;place-items:center;color:white;font-size:22px;font-weight:800;background:linear-gradient(145deg,#ffb6a6,#b6387b);background-size:cover;background-position:center}.personrow .meta{min-width:0;flex:1}.personrow strong{display:block}.btn{width:100%;border:0;border-radius:14px;padding:12px 15px;margin:5px 0;background:linear-gradient(100deg,var(--pink),var(--coral));color:white;font-weight:800}.btn.secondary{background:var(--card);border:1px solid var(--line);color:var(--ink)}.btn.small{width:auto;padding:8px 12px;margin:0;font-size:12px}.field{display:block;width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px;margin:5px 0 12px}.label{display:block;font-weight:700;margin:10px 0 3px}.chips{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 14px}.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:7px 11px;font-size:12px}.chip.selected{background:var(--pink);color:white;border-color:var(--pink)}.message{padding:10px 13px;border:1px solid var(--line);background:var(--card);border-radius:17px;margin:7px 0;max-width:82%;overflow-wrap:anywhere}.message.mine{margin-left:auto;background:var(--pink);border-color:var(--pink);color:white}.composer{display:flex;gap:7px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);background:var(--card)}.composer input{flex:1;margin:0}.empty{text-align:center;padding:35px 12px}.empty .emoji{font-size:42px;margin-bottom:8px}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:10;background:var(--ink);color:white;border-radius:13px;padding:11px 16px;box-shadow:var(--shadow);max-width:90%}.modalback{position:fixed;inset:0;background:#170b28a8;display:flex;align-items:flex-end;justify-content:center;z-index:20}.modal{width:min(480px,100%);max-height:85dvh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:20px 18px 30px}.modalhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.smallnote{font-size:11px;color:var(--muted);text-align:center;padding:8px 16px}@media(min-width:600px){body{padding:20px 0}#app{min-height:calc(100dvh - 40px);height:calc(100dvh - 40px);border-radius:28px;box-shadow:0 20px 80px #35164c18}.profilecard{height:420px}}
</style></head>
<body><div id="app"><header class="top"><div class="mark">♥</div><span class="logo">Duet</span><span class="spacer"></span><button class="iconbtn" id="theme" aria-label="Switch theme">☾</button></header><div id="tabs" class="tabs"></div><main id="main"></main><nav id="nav" class="bottomnav"></nav><div class="smallnote">Duet demo · Sample profiles are fictional · Local browser data only</div></div>
<script>
(function(){'use strict';
var $=function(s){return document.querySelector(s)},esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var sample=[
{id:'p1',n:'Amara',a:25,g:'Woman',city:'Nairobi',bio:'Sunsets, good music, spontaneous road trips and conversations that last longer than planned.',intent:'Long-term',tags:['Travel','Music','Coffee'],z:'Leo',photo:'photo-1534528741775-53994a69daeb'},
{id:'p2',n:'Noah',a:27,g:'Man',city:'Westlands',bio:'Chef on weekdays, amateur hiker on weekends. I make a great chai.',intent:'Long-term',tags:['Cooking','Hiking','Movies'],z:'Taurus',photo:'photo-1500648767791-00dcc994a43e'},
{id:'p3',n:'Zuri',a:24,g:'Woman',city:'Kilimani',bio:'Bookshops, art galleries and finding the best hidden food spots in town.',intent:'Friendship',tags:['Art','Books','Coffee'],z:'Gemini',photo:'photo-1524504388940-b1c1722653e1'},
{id:'p4',n:'Ethan',a:29,g:'Man',city:'Karen',bio:'Tech by day, live music by night. Looking for someone kind and curious.',intent:'Long-term',tags:['Tech','Music','Travel'],z:'Aquarius',photo:'photo-1506794778202-cad84cf45f1d'},
{id:'p5',n:'Imani',a:26,g:'Non-binary',city:'Lavington',bio:'Plant parent, playlist maker, always down for a museum date.',intent:'Still figuring it out',tags:['Art','Coffee','Travel'],z:'Pisces',photo:'photo-1531123897727-8f129e1688ce'}];
function read(k,d){try{var v=JSON.parse(localStorage.getItem('duet:'+k));return v==null?d:v}catch(e){return d}}function write(k,v){try{localStorage.setItem('duet:'+k,JSON.stringify(v))}catch(e){toast('Browser storage is full.')}}
var me=read('profile',{name:'You',age:25,gender:'Woman',show:'Everyone',intent:'Long-term',bio:'',tags:[],z:'Not set'}),likes=read('likes',[]),passed=read('passed',[]),matches=read('matches',[]),messages=read('messages',{}),tab='disc',sub='you',idx=0,chatId=null,theme=read('theme','light');
function save(){write('profile',me);write('likes',likes);write('passed',passed);write('matches',matches);write('messages',messages)}function toast(t){var e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(function(){e.remove()},2300)}function photo(p){return p.photo?'https://images.unsplash.com/'+p.photo+'?auto=format&fit=crop&w=900&q=85':''}function avatar(p){return '<div class="avatar" style="background-image:url('+JSON.stringify(photo(p))+')">'+(photo(p)?'':esc((p.n||'?')[0]))+'</div>'}function btn(t,fn,cls){return '<button class="'+(cls||'btn')+'" onclick="'+fn+'">'+t+'</button>'}function people(){return sample.filter(function(p){return !passed.includes(p.id)})}
function render(){document.documentElement.style.colorScheme=theme;var dark=theme==='dark';document.documentElement.style.setProperty('--bg',dark?'#120a22':'#fbf8ff');document.documentElement.style.setProperty('--card',dark?'#1d1331':'#fff');document.documentElement.style.setProperty('--ink',dark?'#f4effc':'#241633');document.documentElement.style.setProperty('--muted',dark?'#a99fc2':'#796d89');document.documentElement.style.setProperty('--line',dark?'#352746':'#eee5f5');$('#theme').textContent=dark?'☀':'☾';
$('#tabs').innerHTML=tab==='disc'?'<button class="'+(sub==='you'?'active':'')+'" onclick="setSub(\'you\')">♥ For you</button><button class="'+(sub==='dd'?'active':'')+'" onclick="setSub(\'dd\')">♧ Double date</button><button class="'+(sub==='astro'?'active':'')+'" onclick="setSub(\'astro\')">✧ Astrology</button>':'';
$('#nav').innerHTML=[['disc','⌕','Explore'],['likes','♡','Likes'],['chats','☏','Chats'],['me','♙','Profile']].map(function(x){return '<button class="'+(tab===x[0]?'active':'')+'" onclick="go(\''+x[0]+'\')"><span class="navico">'+x[1]+'</span>'+x[2]+((x[0]==='likes'&&likes.length)||(x[0]==='chats'&&matches.length)?'<i class="badge"></i>':'')+'</button>'}).join('');
$('#main').innerHTML=tab==='disc'?explore():tab==='likes'?likesView():tab==='chats'?chatsView():tab==='chat'?chatView():profileView()}
function empty(title,desc){return '<div class="empty"><div class="emoji">💌</div><h2>'+title+'</h2><p class="subtle">'+desc+'</p></div>'}
function personRow(p,action,extra){return '<div class="personrow">'+avatar(p)+'<div class="meta"><strong>'+esc(p.n)+', '+p.a+'</strong><div class="subtle">'+esc(extra||p.intent)+' · '+esc(p.city)+'</div></div>'+btn('♥ Like',action,'btn small')+'</div>'}
function explore(){if(sub==='dd')return '<p class="greeting">A little more fun together</p><h2>Double dates</h2><p class="subtle">Meet as a group of four. Find a match, then suggest bringing friends along.</p><div class="panel"><b>Keep it easy</b><p class="subtle">Choose a public café, park or activity where everyone can relax.</p></div>'+people().map(function(p){return personRow(p,"like('"+p.id+"')")}).join('')||empty('No new profiles','Try again later.');
if(sub==='astro')return '<p class="greeting">For fun, not fate</p><h2>Cosmic chemistry ✨</h2><p class="subtle">Star signs can be a conversation starter, not a rulebook.</p><div class="panel"><label class="label">Your sign</label><select class="field" onchange="setSign(this.value)">'+['Not set','Aries','Taurus','Gemini','Cancer','Leo','Virgo','Libra','Scorpio','Sagittarius','Capricorn','Aquarius','Pisces'].map(function(z){return '<option '+(me.z===z?'selected':'')+'>'+z+'</option>'}).join('')+'</select></div>'+people().map(function(p){return personRow(p,"like('"+p.id+"')",p.z)}).join('');
var list=people(),p=list[idx%Math.max(list.length,1)];if(!p)return '<div class="empty"><div class="emoji">💗</div><h2>You are all caught up</h2><p class="subtle">You have seen every profile in this demo.</p>'+btn('Reset demo','resetDemo()','btn secondary')+'</div>';
return '<p class="greeting">Good '+(new Date().getHours()<12?'morning':new Date().getHours()<18?'afternoon':'evening')+',</p><p class="greeting"><strong>'+esc(me.name||'You')+' ✨</strong></p><div class="dateideas">'+[['☕','Coffee'],['♧','Park walk'],['♫','Live music'],['▧','Museum']].map(function(x){return '<button class="idea" onclick="idea(\''+x[1]+'\')"><span>'+x[0]+'</span>'+x[1]+'</button>'}).join('')+'</div><article class="profilecard"><div class="cover" style="background-image:url('+JSON.stringify(photo(p))+')"></div><span class="distance">⌖ '+esc(p.city)+' · nearby</span><button class="more" onclick="profileDetail(\''+p.id+'\')">···</button><div class="details"><h2>'+esc(p.n)+', '+p.a+' <span class="verified">✓</span></h2><div>'+esc(p.intent)+' · '+esc(p.city)+'</div><p style="margin:8px 0 0;font-size:14px">'+esc(p.bio)+'</p>'+p.tags.map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join('')+'</div></article><div class="actions"><button class="action" aria-label="Undo" onclick="undo()">↶</button><button class="action pass" aria-label="Pass" onclick="act(\'pass\')">✕</button><button class="action star" aria-label="Super like" onclick="act(\'super\')">★</button><button class="action big" aria-label="Like" onclick="act(\'like\')">♥</button><button class="action" aria-label="Send note" onclick="note(\''+p.id+'\')">➤</button></div><div class="hint">A chat opens when you both like each other.</div>'}
function act(k){var list=people(),p=list[idx%Math.max(list.length,1)];if(!p)return;if(k==='pass'){passed.push(p.id);save();idx=0;render();return}like(p.id,k==='super')}
function like(id,superLike){if(likes.includes(id))return;likes.push(id);var mutual=(id==='p1'&&likes.includes('p3'))||Math.random()<.2;if(mutual&&!matches.includes(id)){matches.push(id);messages[id]=messages[id]||[];save();render();modal('<div style="text-align:center;padding:18px 0"><div style="font-size:45px">💞</div><h2>It\'s a match!</h2><p>You and '+esc(sample.find(function(p){return p.id===id}).n)+' liked each other.</p>'+btn('Say hello',"openChat('"+id+"')")+btn('Keep exploring','closeModal()','btn secondary')+'</div>');return}save();idx=0;render();toast(superLike?'Super Like saved!':'Like saved in this demo')}
function undo(){if(!passed.length)return toast('Nothing to undo yet.');passed.pop();save();render()}
function likesView(){var l=sample.filter(function(p){return likes.includes(p.id)});return '<div class="sectionhead"><h2>Likes</h2><span class="subtle">'+l.length+' sent</span></div><p class="subtle">Your likes are saved on this browser in the demo.</p>'+l.map(function(p){return personRow(p,"profileDetail('"+p.id+"')",'You liked them')}).join('')||empty('Your story starts here','Like a profile in Explore and it will appear here.')}
function chatsView(){return '<h2>Your chats</h2><p class="subtle">Messages stay in this browser in this demo.</p>'+matches.map(function(id){var p=sample.find(function(x){return x.id===id}),last=(messages[id]||[]).slice(-1)[0];return '<div class="personrow" onclick="openChat(\''+id+'\')" style="cursor:pointer">'+avatar(p)+'<div class="meta"><strong>'+esc(p.n)+'</strong><div class="subtle">'+esc(last?last.text:'You matched — say hi!')+'</div></div><span>›</span></div>'}).join('')||empty('No matches yet','When a demo match happens, you can chat here.')}
function openChat(id){if(!matches.includes(id))return toast('Chat is available only for demo matches.');chatId=id;tab='chat';render()}
function chatView(){var p=sample.find(function(x){return x.id===chatId});if(!p){tab='chats';return chatsView()}var arr=messages[chatId]||[];return '<div class="sectionhead"><button class="iconbtn" onclick="go(\'chats\')">‹</button><div style="flex:1">'+avatar(p)+'<strong>'+esc(p.n)+'</strong></div><span class="subtle">Demo chat</span></div><div style="min-height:45vh;display:flex;flex-direction:column;justify-content:flex-end">'+arr.map(function(m){return '<div class="message '+(m.mine?'mine':'')+'">'+esc(m.text)+'<div style="font-size:10px;opacity:.7;text-align:right">'+esc(m.time)+'</div></div>'}).join('')+'</div><form class="composer" onsubmit="sendMessage(event)"><input id="messageInput" class="field" maxlength="500" placeholder="Write a message…" required><button class="btn small" type="submit">Send</button></form>'}
function sendMessage(e){e.preventDefault();var input=$('#messageInput'),text=input.value.trim();if(!text)return;(messages[chatId]=messages[chatId]||[]).push({text:text,mine:true,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});save();render()}
function profileView(){return '<div class="sectionhead"><h2>Your profile</h2><span class="subtle">Demo profile</span></div><div class="panel" style="text-align:center;padding:22px"><div class="avatar" style="width:78px;height:78px;margin:auto">'+esc((me.name||'Y')[0])+'</div><h2 style="margin-top:10px">'+esc(me.name)+', '+me.age+'</h2><p class="subtle">'+esc(me.gender)+' · Looking for '+esc(me.intent)+'</p><p>'+esc(me.bio||'Add a bio to show your personality.')+'</p>'+me.tags.map(function(t){return '<span class="chip selected">'+esc(t)+'</span>'}).join('')+'</div><h3>Edit your profile</h3><label class="label">Display name</label><input id="name" class="field" maxlength="30" value="'+esc(me.name)+'"><label class="label">Age (18+)</label><input id="age" class="field" type="number" min="18" max="99" value="'+me.age+'"><label class="label">I am</label><select id="gender" class="field">'+['Woman','Man','Trans woman','Trans man','Non-binary','Self-described'].map(function(x){return '<option '+(me.gender===x?'selected':'')+'>'+x+'</option>'}).join('')+'</select><label class="label">Show me</label><select id="show" class="field">'+['Everyone','Women','Men'].map(function(x){return '<option '+(me.show===x?'selected':'')+'>'+x+'</option>'}).join('')+'</select><label class="label">Looking for</label><select id="intent" class="field">'+['Long-term','Short-term','Casual','Friendship','Still figuring it out'].map(function(x){return '<option '+(me.intent===x?'selected':'')+'>'+x+'</option>'}).join('')+'</select><label class="label">Bio</label><textarea id="bio" class="field" rows="3" maxlength="300">'+esc(me.bio)+'</textarea><label class="label">Interests</label><div class="chips">'+['Music','Travel','Fitness','Cooking','Movies','Pets','Art','Books','Tech','Dancing','Hiking','Coffee'].map(function(t){return '<button class="chip '+(me.tags.includes(t)?'selected':'')+'" onclick="toggleTag(\''+t+'\',this)">'+t+'</button>'}).join('')+'</div>'+btn('Save profile','saveProfile()')+btn('Reset demo data','resetDemo()','btn secondary')+'<div class="panel"><b>Privacy note</b><p class="subtle">This is a front-end prototype. It has no account system, shared database, real messaging service, photo upload service or live moderation. Do not enter sensitive personal information.</p></div>'}
function toggleTag(t,b){var i=me.tags.indexOf(t);if(i<0)me.tags.push(t);else me.tags.splice(i,1);b.classList.toggle('selected',i<0)}
function saveProfile(){var name=$('#name').value.trim(),age=Number($('#age').value);if(!name||age<18||age>99)return toast('Enter a name and age of 18 or older.');me.name=name;me.age=age;me.gender=$('#gender').value;me.show=$('#show').value;me.intent=$('#intent').value;me.bio=$('#bio').value.trim();save();toast('Profile saved on this device.');render()}
function setSign(z){me.z=z;save()}function profileDetail(id){var p=sample.find(function(x){return x.id===id});if(!p)return;modal('<div class="modalhead"><h2>'+esc(p.n)+', '+p.a+'</h2><button class="iconbtn" onclick="closeModal()">×</button></div><div class="profilecard" style="height:300px"><div class="cover" style="background-image:url('+JSON.stringify(photo(p))+')"></div><div class="details"><h2>'+esc(p.n)+', '+p.a+'</h2><p>'+esc(p.city)+' · '+esc(p.intent)+'</p></div></div><p>'+esc(p.bio)+'</p>'+p.tags.map(function(t){return '<span class="chip">'+esc(t)+'</span>'}).join('')+btn('♥ Like '+esc(p.n),"closeModal();like('"+id+"')"))}
function idea(n){modal('<div class="modalhead"><h2>'+esc(n)+' date idea</h2><button class="iconbtn" onclick="closeModal()">×</button></div><p>Keep a first date relaxed, choose a public place and let a friend know your plans.</p>'+btn('Sounds good','closeModal()'))}
